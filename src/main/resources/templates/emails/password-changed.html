<!doctype html>
<html><body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#111827">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:8px">
  <tr><td style="padding:28px">
    <p style="margin:0 0 4px;font-size:14px;color:#6b7280">Apex Commerce · {e.storeName}</p>
    <h1 style="margin:0;font-size:22px">Your password was changed</h1>
    <p style="margin:12px 0 0;font-size:15px;line-height:1.5">Hi {e.fullName}, the password for your store's dashboard was just changed,
      and every other device was signed out.</p>
    <p style="margin:16px 0 0;font-size:15px;line-height:1.5"><strong>Wasn't you?</strong> Reset your password right away:
      <a href="{forgotUrl}" style="color:#c2410c">{forgotUrl}</a></p>
  </td></tr>
</table>
</td></tr></table>
</body></html>
