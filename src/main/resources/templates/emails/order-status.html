<!doctype html>
<html><body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#111827">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px">
  <tr><td style="padding:28px">
    <p style="margin:0 0 4px;font-size:14px;color:#6b7280">{o.storeName}</p>
    <h1 style="margin:0;font-size:22px">{heading}</h1>
    <p style="margin:12px 0 0;font-size:15px;line-height:1.5">Hi {o.customerName}, {message}</p>
    <p style="margin:16px 0 0;font-size:14px">Order <strong>{o.number}</strong> &middot; {total}</p>
    <p style="margin:20px 0 0;font-size:14px;line-height:1.5;color:#4b5563">Questions? Just reply to this email.<br>
      <a href="{storeUrl}" style="color:#c2410c">Visit {o.storeName}</a></p>
  </td></tr>
</table>
</td></tr></table>
</body></html>
