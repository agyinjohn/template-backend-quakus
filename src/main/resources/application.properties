# ---------------------------------------------------------------- app
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.upload-max-bytes=5242880
app.jwt.issuer=https://apex-commerce
app.jwt.ttl-hours=72

quarkus.http.port=8080
quarkus.http.limits.max-body-size=10M

# ---------------------------------------------------------------- email
# Order emails go to shoppers (confirmation, status updates) and store owners (new order).
# Dev/test: emails are logged, not sent (mock). Production: set MAIL_HOST etc. to a real SMTP server.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4321}
app.mail.enabled=${MAIL_ENABLED:true}
quarkus.mailer.from=${MAIL_FROM:Apex Commerce <orders@apex-commerce.local>}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
quarkus.mailer.login=${MAIL_LOGIN:REQUIRED}
quarkus.mailer.mock=${MAIL_MOCK:true}
%prod.quarkus.mailer.mock=${MAIL_MOCK:false}

# ---------------------------------------------------------------- payments (Paystack, one account per store)
app.paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
# unpaid online-payment orders are cancelled (and their stock released) after this long
app.payment.expiry-minutes=${PAYMENT_EXPIRY_MINUTES:60}
# AES key (base64, 32 bytes) that encrypts stores' Paystack secret keys at rest.
# A dev/test key is used by default; production MUST set APP_ENCRYPTION_KEY (generate: openssl rand -base64 32).
app.encryption-key=${APP_ENCRYPTION_KEY:ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=}
%prod.app.encryption-key=${APP_ENCRYPTION_KEY}
# tests start a fake Paystack server and point app.paystack.base-url at it (see FakePaystack)

# ---------------------------------------------------------------- CORS (storefront + admin frontend)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4321}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept

# ---------------------------------------------------------------- database
# dev + prod: PostgreSQL (configure with DB_URL / DB_USER / DB_PASSWORD)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/apex_commerce}
quarkus.datasource.username=${DB_USER:apex}
quarkus.datasource.password=${DB_PASSWORD:apex}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=update

# tests: in-memory H2, no external database needed
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:apex;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.app.upload-dir=target/test-uploads

# ---------------------------------------------------------------- JWT
# DEV/TEST ONLY keys are bundled. Production MUST provide its own:
#   JWT_PUBLIC_KEY_LOCATION / JWT_PRIVATE_KEY_LOCATION (file paths or URLs)
mp.jwt.verify.issuer=${app.jwt.issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/dev-public.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt/dev-private.pem}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

# ---------------------------------------------------------------- docs
quarkus.smallrye-openapi.info-title=Apex Commerce API
quarkus.swagger-ui.always-include=true
